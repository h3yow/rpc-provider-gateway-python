[project]
name = "rpc-provider-gateway-python"
version = "0.1.0"
description = "本地多上游 JSON-RPC 网关：故障转移 / 头依赖缓存一致性 / 调用配额"
requires-python = ">=3.14.4"
dependencies = [
    "fastapi[standard]>=0.141.1",
    "httpx>=0.28.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
log_cli = false
log_level = "INFO"
testpaths = ["tests"]

[[tool.uv.index]]
url = "https://mirrors.aliyun.com/pypi/simple/"
default = true
